name: Paper

on:
  push:
    branches:
      - stage7-paper
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Build manuscript
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Require clean bibliography, references, and layout log
        working-directory: paper
        run: |
          ! grep -E "LaTeX Warning: (Citation|Reference).*undefined|There were undefined references|There were undefined citations" main.log
          ! grep -E "Overfull \\\\hbox|Token not allowed in a PDF string" main.log

      - name: Inspect PDF metadata and text
        working-directory: paper
        run: |
          pdfinfo main.pdf
          pdftotext main.pdf - | head -n 40

      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: pascal-cofactors-paper
          path: paper/main.pdf
          if-no-files-found: error
